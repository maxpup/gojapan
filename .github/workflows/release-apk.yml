name: Build APK for release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with the fixed signing key
        env:
          GOJAPAN_SIGNING_KEYSTORE_BASE64: ${{ secrets.GOJAPAN_SIGNING_KEYSTORE_BASE64 }}
          GOJAPAN_SIGNING_STORE_PASSWORD: ${{ secrets.GOJAPAN_SIGNING_STORE_PASSWORD }}
          GOJAPAN_SIGNING_KEY_ALIAS: ${{ secrets.GOJAPAN_SIGNING_KEY_ALIAS }}
          GOJAPAN_SIGNING_KEY_PASSWORD: ${{ secrets.GOJAPAN_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${GOJAPAN_SIGNING_KEYSTORE_BASE64:?Missing fixed signing key; refusing temporary signing}"
          export GOJAPAN_SIGNING_STORE_FILE="$RUNNER_TEMP/gojapan-fixed.p12"
          trap 'rm -f "$GOJAPAN_SIGNING_STORE_FILE"' EXIT
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          path = Path(os.environ['GOJAPAN_SIGNING_STORE_FILE'])
          path.write_bytes(base64.b64decode(os.environ['GOJAPAN_SIGNING_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
          python3 tools/build-signed.py testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GoJapan-1.0.1-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Prepare release
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/GoJapan-1.0.1.apk
          cd release
          sha256sum GoJapan-1.0.1.apk > SHA256SUMS.txt
          cat > "$GITHUB_WORKSPACE/release-notes.md" <<'NOTES'
          GoJapan Android 1.0.1 测试版，versionCode=2，Android 8.0 及以上。

          使用固定签名，兼容 v1.0-fixes-20261111 的新版证书；不兼容最早 v1.0 的临时签名。
          发布前验证单元测试、Lint、debug/release 构建及 APK 证书指纹。
          NOTES
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 release/GoJapan-1.0.1.apk release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GoJapan 1.0.1（固定签名测试版）" --prerelease --notes-file "$GITHUB_WORKSPACE/release-notes.md"
